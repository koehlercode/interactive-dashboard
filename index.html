<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="css/style.css">
    
    <title>My Interactive Dashboard</title>
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Stefany Koehler for the WEB-115 course at Wake Tech</p>
       
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>

    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>
        Unfortunately, your web browser does not support JavaScript.
    </noscript>

    <div class="container">
        <div class="row">
            <div class="col" id="weekly-tasks">
                <!-- Updated path to point inside the "js" folder -->
                <script src="js/task-manager.js"></script>

                <form id="task-form">
                  <!-- Name Field -->
                    <div class="form-group">
                      <label for="user-name">Name:</label>
                      <input type="text" id="user-name" name="userName">
                    </div>

                  <!-- Daily Task Goal Field -->
                    <div class="form-group">
                       <label for="daily-goal">Daily Task Goal:</label>
                       <input type="number" id="daily-goal" name="dailyGoal">
                    </div>

                  <!-- Weekly Bonus Tasks Field -->
                    <div class="form-group">
                       <label for="weekly-bonus">Weekly Bonus Tasks:</label>
                       <input type="number" id="weekly-bonus" name="weeklyBonus">
                    </div>

                 <!-- Submit Button -->
                  <button type="submit" id="goal-btn">Set Goal</button>
                </form>

                <!-- Output Area -->
                <p id="goal-message"></p>
            </div>
        </div>
    </div>
</body>
</html>
